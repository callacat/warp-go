<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f26432'/%3E%3Cpath d='M7 23 L12 9 L16 18 L20 9 L25 23' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>warp-go GUI</title>
    <script>
      // 防首帧闪白：React 挂载前按持久化偏好同步打 .dark class。
      // config.json 的权威值由 App 根部的 useTheme() 挂载后校正，
      // 这里只用 localStorage 做零延迟预上色（消除启动瞬间亮瞎眼）。
      (function () {
        try {
          var m = localStorage.getItem("warpgo-theme");
          if (m === null) {
            // 兼容旧版 legacy key："1"=dark、"0"=light
            var legacy = localStorage.getItem("warpgo-dark");
            m = legacy === "1" ? "dark" : legacy === "0" ? "light" : "system";
          }
          var dark =
            m === "dark" ||
            (m !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* 存储不可用时按浅色渲染，等 React 挂载后兜底 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
