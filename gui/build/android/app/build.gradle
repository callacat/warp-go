plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.wails.app"
        minSdk 21
        targetSdk 35
        // 版本号由 CI 注入（VERSION_NAME 如 0.5.3）；本地构建回退 1.0。
        // versionCode 用语义版本的主/次/补丁拼成整数（0.5.3 → 503），
        // 保证单调递增（Play 要求每次上传 versionCode 必须增大）。
        def versionNameStr = System.getenv("VERSION_NAME") ?: "1.0"
        def parts = versionNameStr.split("\\.").collect { it.toInteger() }
        // versionCode 用语义版本的主/次/补丁拼成整数（0.5.3 → 503）。
        // 手动触发/本地构建时版本号可能是 2 段（如 "1.0"）或缺段——
        // 缺段补 0，避免 parts[2] 为 null 触发 Integer.plus(null) 崩溃
        // （CI workflow_dispatch 时 GITHUB_REF_NAME=main → VERSION=1.0）。
        def major = parts.size() > 0 ? parts[0] : 0
        def minor = parts.size() > 1 ? parts[1] : 0
        def patch = parts.size() > 2 ? parts[2] : 0
        versionCode (major * 10000 + minor * 100 + patch)
        versionName versionNameStr

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
