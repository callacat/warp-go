# sync-upstream.yml
# 每天检查双上游仓库更新，检测到变更时创建 PR 以便审查后合并。
# upstreams: 6Kmfi6HP/warp-go（主） + badafans/warp-go（原始 fork 源）
name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstreams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 双上游
          UPSTREAMS="6Kmfi6HP:warp-go badafans:warp-go"
          UPDATED=""

          for entry in $UPSTREAMS; do
            OWNER="${entry%%:*}"
            REPO="${entry##*:}"
            URL="https://github.com/${OWNER}/${REPO}.git"

            echo "→ 添加远程仓库 ${OWNER}"
            git remote add "${OWNER}" "${URL}" 2>/dev/null || true

            echo "→ 抓取 ${OWNER}"
            git fetch "${OWNER}" main || git fetch "${OWNER}" master
            REF=$(git branch -r | grep "${OWNER}/" | grep -E '(main|master)' | head -1 | xargs)

            echo "→ ${OWNER} HEAD: $(git rev-parse "${REF}")"

            if git diff --quiet HEAD "${REF}" 2>/dev/null; then
              echo "=== ${OWNER} 已是最新 ==="
              continue
            fi
            UPDATED="${UPDATED} ${OWNER}"
          done

          if [ -z "$UPDATED" ]; then
            echo "=== 所有上游已是最新，无需同步 ==="
            exit 0
          fi

          echo "=== 上游有更新：${UPDATED} ==="

          # 取 6Kmfi6HP 为 merge 源（主）
          MERGE_REF=$(git branch -r | grep '6Kmfl6HP/' | grep -E '(main|master)' | head -1 | xargs)
          if [ -z "$MERGE_REF" ]; then
            MERGE_REF=$(git branch -r | grep 'badafans/' | grep -E '(main|master)' | head -1 | xargs)
          fi

          SYNC_BRANCH="sync/upstream-$(date +%Y%m%d-%H%M)"
          echo "→ 同步源：${MERGE_REF}"
          git push origin "$(git rev-parse "${MERGE_REF}"):refs/heads/${SYNC_BRANCH}" --force

          gh label create "conflict ⚠️" --color "d73a4a" 2>/dev/null || true

          PR_URL=$(gh pr create \
            --base "$(git rev-parse --abbrev-ref HEAD)" \
            --head "$SYNC_BRANCH" \
            --title "⬆️ Sync upstream $(date +%Y-%m-%d)" \
            --body "自动同步上游更新。来源：${UPDATED}。" \
            2>/dev/null || echo "")

          if [ -z "$PR_URL" ]; then
            echo "(可能已有同类 PR 处于 open 状态)"
          else
            sleep 10
            gh pr merge "$SYNC_BRANCH" --auto --merge \
              --subject "Sync upstream $(date +%Y-%m-%d)" \
              2>&1 || echo "(自动合并未启用)"

            sleep 5
            if [ "$(gh pr view "$SYNC_BRANCH" --json mergeable --jq .mergeable 2>/dev/null)" = "false" ]; then
              gh pr edit "$SYNC_BRANCH" --add-label "conflict ⚠️"
              echo "::warning::Sync PR has conflicts — manual resolution needed"
            fi
          fi