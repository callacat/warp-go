name: Android DebugDiag Build

# 构建带 debugdiag tag 的 Android 调试 APK（收集 payload 层遥测：
# tunnels.tsv / udp.tsv / tun0.tsv 写入沙箱 debugdiag/，停止时经 MediaStore
# 打包到 Download）。正式版（build-release 的 build-android job）不带
# debugdiag tag，编译 debugdiag_stub.go 的 no-op，零调试代码。
#
# 用法：workflow_dispatch 手动触发 → 下载 artifact warp-android-debugdiag
# 的 app-release.apk（与正式版同一 warp-release.p12 签名，可覆盖安装不丢
# reg.json）。

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-android-debugdiag:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 26.3.11579264
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux GUI 构建依赖（wails3 CLI 编译需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（platform-tools / platforms / build-tools / NDK）
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.NDK_VERSION }}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: 设置 Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true # 依赖模块缓存：go.sum 不变则复用 runner 缓存

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: 安装 wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 整理 Go 依赖
        working-directory: gui
        run: go mod tidy

      - name: 生成 Android overlay
        working-directory: gui
        run: wails3 android overlay:gen -out build/android/overlay.json -config build/config.yml

      - name: 生成 Wails 绑定（Android 标签）
        working-directory: gui
        run: wails3 generate bindings -ts -f '-tags android' -clean=true

      - name: 构建前端
        working-directory: gui/frontend
        run: |
          npm ci || npm install
          npm run build

      # debugdiag tag：与正式版唯一的差别——启用 androidvpn/debugdiag.go
      # （release 编译 debugdiag_stub.go no-op）。
      - name: 编译 c-shared 库（arm64-v8a，debugdiag）
        working-directory: gui
        env:
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          mkdir -p build/android/app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -overlay build/android/overlay.json \
            -tags production,android,with_gvisor,debugdiag -trimpath -buildvcs=false \
            -ldflags="-w -s -X main.version=${VERSION}" \
            -o build/android/app/src/main/jniLibs/arm64-v8a/libwails.so

      - name: 编译 c-shared 库（x86_64，debugdiag）
        working-directory: gui
        env:
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          mkdir -p build/android/app/src/main/jniLibs/x86_64
          go build -buildmode=c-shared -overlay build/android/overlay.json \
            -tags production,android,with_gvisor,debugdiag -trimpath -buildvcs=false \
            -ldflags="-w -s -X main.version=${VERSION}" \
            -o build/android/app/src/main/jniLibs/x86_64/libwails.so

      - name: 校验 JNI 符号 Java↔Go 一致
        working-directory: gui
        run: |
          grep -qE 'int +nativeBridgeReady *\(\)' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -qE 'Java_com_wails_app_MainActivity_nativeBridgeReady.*C\.jint' androidbridge.go
          grep -q 'requestStartVpn' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -q 'requestStartVpn' androidbridge.go
          grep -q 'requestStopVpn' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -q 'requestStopVpn' androidbridge.go
          grep -qE 'int +nativeStartVpn *\(int fd\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'Java_com_wails_app_WarpVpnService_nativeStartVpn.*C\.jint' androidbridge.go
          grep -qE 'int +nativeStopVpn *\(\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'Java_com_wails_app_WarpVpnService_nativeStopVpn.*C\.jint' androidbridge.go
          grep -qE 'int +nativeVpnRunning *\(\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'Java_com_wails_app_WarpVpnService_nativeVpnRunning.*C\.jint' androidbridge.go
          grep -qE 'static +boolean +protectSocket *\(int fd\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'GetStaticMethodID\(env, cls, "protectSocket", "\(I\)Z"\)' androidbridge.go
          grep -qE 'static +void +kernelFailed *\(String msg\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'GetStaticMethodID\(env, cls, "kernelFailed", "\(Ljava/lang/String;\)V"\)' androidbridge.go
          grep -qE 'int +nativeLogMessage *\(String level, String msg\)' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -qE 'Java_com_wails_app_MainActivity_nativeLogMessage.*C\.jint' androidbridge.go
          grep -qE 'int +nativeSetTimeZone *\(String tz\)' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -qE 'Java_com_wails_app_MainActivity_nativeSetTimeZone.*C\.jint' androidbridge.go
          grep -qE 'static +String +exportDebugDiag *\(' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -qE 'GetStaticMethodID\(env, cls, "exportDebugDiag", "\(\)Ljava/lang/String;"\)' androidbridge.go
          # debugdiag 收集器必须编译进此变体（否则导出空包）。
          grep -qE 'DebugSetDir' androidbridge.go
          grep -qE 'func DebugSetDir' ../androidvpn/debugdiag.go

      - name: 构建 Release APK（debugdiag 签名，可覆盖安装）
        working-directory: gui/build/android
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="1.0"; fi
          export VERSION_NAME="$VERSION"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传 debugdiag APK
        uses: actions/upload-artifact@v4
        with:
          name: warp-android-debugdiag
          path: gui/build/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
