name: Cleanup Stale Artifacts

on:
  schedule:
    - cron: '0 6 * * 0'    # 每周日 UTC 6:00
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up workflow runs, caches, and release drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          RETENTION_DAYS=30
          CUTOFF=$(date -d "${RETENTION_DAYS} days ago" -u +%Y-%m-%dT%H:%M:%SZ)
          DELETED_RUNS=0

          echo "=== 清理 ${CUTOFF} 之前的 workflow runs ==="
          PAGE=1
          while true; do
            RUNS=$(gh run list -R "$REPO" --limit 100 --json databaseId,createdAt,status \
              --jq ".[] | select(.createdAt < \"${CUTOFF}\") | .databaseId" 2>/dev/null)
            if [ -z "$RUNS" ]; then break; fi
            echo "$RUNS" | while read id; do
              echo "  删除 run $id"
              gh run delete "$id" -R "$REPO" 2>/dev/null && DELETED_RUNS=$((DELETED_RUNS + 1)) || true
            done
            PAGE=$((PAGE + 1))
            [ "$PAGE" -gt 20 ] && break
          done

          echo "=== 清理过期 caches ==="
          gh api "repos/$REPO/actions/caches" --jq \
            ".actions_caches[]? | select(.last_accessed_at < \"${CUTOFF}\") | .id" \
            | while read cid; do
              echo "  删除 cache $cid"
              gh api "repos/$REPO/actions/caches/$cid" -X DELETE 2>/dev/null || true
            done

          echo "=== 清理过期 release drafts ==="
          gh release list -R "$REPO" --limit 100 --json tagName,createdAt,isDraft \
            --jq ".[] | select(.isDraft) | select(.createdAt < \"${CUTOFF}\") | .tagName" \
            | while read tag; do
              echo "  删除 draft release $tag"
              gh release delete "$tag" -R "$REPO" --yes 2>/dev/null || true
            done

          echo "=== 清理完成 ==="