# build-release.yml
# 两个触发器:
#   1. push 到 main/master → 构建 Docker 镜像推送 GHCR (latest)
#   2. 推送 tag (v*)    → 编译多平台 Go 二进制 + 构建 Docker 镜像 (version tag)
#                         创建 GitHub Release 并上传二进制
name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  BINARY_NAME: warp
  GHCR_REGISTRY: ghcr.io

jobs:
  # ── Go 多平台编译 ──────────────────────────────────────────────
  build-binary:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux,   arch: amd64, goarch: amd64,   goos: linux   }
          - { os: linux,   arch: arm64, goarch: arm64,   goos: linux   }
          - { os: darwin,  arch: amd64, goarch: amd64,   goos: darwin  }
          - { os: darwin,  arch: arm64, goarch: arm64,   goos: darwin  }
          - { os: windows, arch: amd64, goarch: amd64,   goos: windows }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build binary
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o "dist/warp-${{ matrix.os }}-${{ matrix.arch }}${EXT}" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: warp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  # ── Docker 多架构构建 + 推送到 GHCR ────────────────────────────
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release (仅在 tag 推送时) ───────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binary, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: warp-*

      - name: Prepare release assets
        run: |
          mkdir -p release
          find dist -type f -name 'warp-*' | while read f; do
            name=$(basename "$f")
            cp "$f" "release/$name"
            echo "- \`$name\`" >> release/assets.md
          done

      - name: Generate changelog
        run: |
          echo "### Docker 镜像" > release/changelog.md
          echo "" >> release/changelog.md
          echo "\`\`\`" >> release/changelog.md
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "docker pull ghcr.io/${REPO}:${{ github.ref_name }}" >> release/changelog.md
          echo "docker pull ghcr.io/${REPO}:latest" >> release/changelog.md
          echo "\`\`\`" >> release/changelog.md
          echo "" >> release/changelog.md
          echo "### 二进制文件" >> release/changelog.md
          echo "" >> release/changelog.md
          cat release/assets.md >> release/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: release/changelog.md
          files: release/warp-*
          generate_release_notes: true
          prerelease: false