# 构建与发布工作流
# 触发：v* 标签推送 + 手动触发
# 流程：test（vet/build/test）→ build-binary（5 平台交叉编译 CLI，gui/ 存在时一并构建）
#       → release（校验和 + GitHub Release，仅 tag 推送时执行）
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: warp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build ./...

      # Android 目标编译检查（CGO=0：androidbridge.go 的 JNI cgo 代码被排除，
      # 但 T2 桩 / T4 kernel / androidconfig.go 等 android 标签代码必须可编译）。
      # with_gvisor：Android TUN 栈走 gVisor（/32 前缀只有 gVisor 栈支持，
      # system/mixed 栈要求前缀含 next 地址——见 androidvpn.go NewStack 注释）。
      # 真实的 cgo 编译门在 build-android job 的 NDK c-shared 构建。
      - name: 编译（Android 目标）
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -tags with_gvisor ./...

      - name: 运行测试
        run: go test ./...

  build-binary:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: 安装 goversioninfo（Windows PE 版本资源生成）
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 构建 CLI 二进制
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          EXE=""
          VERSION="${GITHUB_REF_NAME#v}"   # tag v0.5.3 → 0.5.3；手动触发无 tag 时为空
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          if [ "$GOOS" = "windows" ]; then
            EXE=".exe"
            # Windows PE 版本资源：go:generate 用 goversioninfo 生成 resource_windows.syso
            # （嵌入 FileVersion/ProductName，资源管理器"详细信息"可见，降低报毒误报）。
            # 版本号先写进 versioninfo.json，再生成 syso。
            if [ "$VERSION" != "dev" ]; then
              sed -i "s/0\.0\.0\.0/${VERSION}/g" versioninfo.json
            fi
            go generate ./...
          fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${BINARY_NAME}-${VERSION}-${GOOS}-${GOARCH}${EXE}" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: warp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # GUI 是独立的 Wails v3 模块（gui/go.mod），需要 CGO + 平台 WebView 依赖，
  # 与 CLI 的 CGO_ENABLED=0 构建完全不同，故拆成单独 job（按平台 runner 构建）。
  build-gui:
    needs: test
    # GUI 构建失败不阻塞 CLI Release（产物仍可用）；成功则一并发布 GUI。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: darwin
            runner: macos-latest
          - os: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux GUI 构建依赖
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 设置 Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 安装 goversioninfo（Windows PE 版本资源生成）
        if: matrix.os == 'windows'
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Windows GUI 应用图标：从 appicon.png（仓库唯一图标源）生成 .ico，
      # 供 go generate（goversioninfo，gui/versioninfo.json IconPath）嵌入 PE 资源。
      # 注意：wails3 generate icons 同时生成 mac icns（默认 build/darwin/icon.icns），
      # 目录必须先建；用 -macassetdir/-macfilename 指向已存在目录避免失败。
      - name: 生成 Windows 应用图标
        if: matrix.os == 'windows'
        working-directory: gui/build
        shell: bash
        run: |
          mkdir -p darwin
          wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico -macfilename darwin/icon.icns

      # 先生成 bindings 再构建前端：前端 api.ts 静态 import bindings，
      # 若顺序颠倒，npm build 会打进占位文件（演示模式）。
      - name: 生成 Wails 绑定
        working-directory: gui
        run: |
          wails3 generate bindings

      - name: 构建前端
        working-directory: gui/frontend
        run: |
          npm ci || npm install
          npm run build

      - name: 构建 GUI 二进制
        working-directory: gui
        shell: bash # windows runner 默认 PowerShell，脚本是 bash 语法
        env:
          GOOS: ${{ matrix.os }}
        run: |
          EXE=""
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          LDFLAGS="-s -w -X main.version=${VERSION}"
          if [ "$GOOS" = "windows" ]; then
            EXE=".exe"
            # -H windowsgui：Windows GUI 程序不弹 CMD 黑框（否则每次启动闪黑框）
            LDFLAGS="$LDFLAGS -H windowsgui"
            # Windows PE 版本资源（同 CLI）：写版本进 versioninfo.json 再 go generate
            if [ "$VERSION" != "dev" ]; then
              sed -i "s/0\.0\.0\.0/${VERSION}/g" versioninfo.json
            fi
            go generate ./...
          fi
          GOOS=$GOOS GOARCH=amd64 CGO_ENABLED=1 go build -trimpath -ldflags="$LDFLAGS" -o "../dist/warp-gui-${VERSION}-${GOOS}-amd64${EXE}" .

      - name: 上传 GUI 产物
        uses: actions/upload-artifact@v4
        with:
          name: warp-gui-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Android：Wails v3 c-shared（JNI .so）+ gradle APK/AAB。
  # 与 build-gui 同理，Android 构建失败不阻塞 CLI Release（continue-on-error）。
  # 与桌面 GUI 不同的是 Android 走 NDK 交叉编译（CGO_ENABLED=1 + NDK clang，
  # 标签 android），无本地 WebView 依赖。
  build-android:
    needs: test
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      # 与 Taskfile compile:go:shared 的提示一致：sdkmanager 安装的 NDK 版本。
      # 安装后 ANDROID_NDK_HOME 由 android-actions/setup-android@v3 导出。
      NDK_VERSION: 26.3.11579264
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # wails3 CLI 在 linux 上编译需要 gtk4/webkitgtk pkg-config（与 build-gui
      # linux job 相同）；Android job 的 c-shared 构建本身不需要，但 CLI 安装需要。
      - name: 安装 Linux GUI 构建依赖（wails3 CLI 编译需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（platform-tools / platforms / build-tools / NDK）
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.NDK_VERSION }}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: 设置 Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # go mod tidy：gui/go.mod 尚未收录 androidvpn（sing-tun）依赖，
      # 桌面构建不触发 android 标签，故 tidy 只在 Android 构建前执行。
      - name: 整理 Go 依赖
        working-directory: gui
        run: go mod tidy

      - name: 生成 Android overlay
        working-directory: gui
        run: wails3 android overlay:gen -out build/android/overlay.json -config build/config.yml

      # 生成 Wails 绑定（Android 标签）。注意：不要设 GOOS=android +
      # CGO_ENABLED=0（android 需外部 cgo 链接，该组合会让 wails3 无法加载
      # 任何包：could not import errors: missing package）；用宿主 go 环境即可，
      # 与 build-gui 的 bindings 步骤一致。-tags android 让生成器看到 android
      # 标签文件（androidbridge.go/androidconfig.go）。
      - name: 生成 Wails 绑定（Android 标签）
        working-directory: gui
        run: wails3 generate bindings -f '-tags android' -clean=true

      - name: 构建前端
        working-directory: gui/frontend
        run: |
          npm ci || npm install
          npm run build

      - name: 编译 c-shared 库（arm64-v8a）
        working-directory: gui
        env:
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          mkdir -p build/android/app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared -overlay build/android/overlay.json \
            -tags production,android,with_gvisor -trimpath -buildvcs=false \
            -ldflags="-w -s -X main.version=${VERSION}" \
            -o build/android/app/src/main/jniLibs/arm64-v8a/libwails.so

      - name: 编译 c-shared 库（x86_64）
        working-directory: gui
        env:
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          mkdir -p build/android/app/src/main/jniLibs/x86_64
          go build -buildmode=c-shared -overlay build/android/overlay.json \
            -tags production,android,with_gvisor -trimpath -buildvcs=false \
            -ldflags="-w -s -X main.version=${VERSION}" \
            -o build/android/app/src/main/jniLibs/x86_64/libwails.so

      # 反向 JNI 桥（androidbridge.go ↔ MainActivity.java）符号名与返回类型
      # 必须严格一致，否则运行期 UnsatisfiedLinkError / NoSuchMethodError。
      # 双侧 grep 断言：符号存在 + 返回类型签名对齐（JNI 要求 Java native
      # 声明与 Go 导出函数的返回类型精确匹配；曾发生 Java 声明 void 而 Go
      # 返回 C.jint 的不一致，grep 查不到、只能靠签名级断言拦截）。
      - name: 校验 JNI 符号 Java↔Go 一致
        working-directory: gui
        run: |
          grep -qE 'int +nativeBridgeReady *\(\)' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -qE 'Java_com_wails_app_MainActivity_nativeBridgeReady.*C\.jint' androidbridge.go
          grep -q 'requestStartVpn' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -q 'requestStartVpn' androidbridge.go
          grep -q 'requestStopVpn' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -q 'requestStopVpn' androidbridge.go
          grep -qE 'int +nativeStartVpn *\(int fd\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'Java_com_wails_app_WarpVpnService_nativeStartVpn.*C\.jint' androidbridge.go
          grep -qE 'int +nativeStopVpn *\(\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'Java_com_wails_app_WarpVpnService_nativeStopVpn.*C\.jint' androidbridge.go
          grep -qE 'int +nativeVpnRunning *\(\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'Java_com_wails_app_WarpVpnService_nativeVpnRunning.*C\.jint' androidbridge.go
          # 拨号 socket 保护（VpnService.protect）+ 内核装配失败自拆除：Go 侧
          # 经 warpCtl 调用的 Java 静态方法，签名必须与 C preamble 的
          # GetStaticMethodID 描述严格一致（§6.8.3）。
          grep -qE 'static +boolean +protectSocket *\(int fd\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'GetStaticMethodID\(env, cls, "protectSocket", "\(I\)Z"\)' androidbridge.go
          grep -qE 'static +void +kernelFailed *\(String msg\)' build/android/app/src/main/java/com/wails/app/WarpVpnService.java
          grep -qE 'GetStaticMethodID\(env, cls, "kernelFailed", "\(Ljava/lang/String;\)V"\)' androidbridge.go
          grep -qE 'int +nativeLogMessage *\(String level, String msg\)' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -qE 'Java_com_wails_app_MainActivity_nativeLogMessage.*C\.jint' androidbridge.go
          grep -qE 'int +nativeSetTimeZone *\(String tz\)' build/android/app/src/main/java/com/wails/app/MainActivity.java
          grep -qE 'Java_com_wails_app_MainActivity_nativeSetTimeZone.*C\.jint' androidbridge.go

      # assembleRelease 用仓库内固定的 warp-release.p12 签名（app/build.gradle
      # signingConfigs.release 默认引用该 p12，无需仓库 secrets；仅在设置
      # ANDROID_KEYSTORE_* 环境变量时才用环境 keystore）。固定签名保证每次构建
      # 的 APK/AAB 签名一致，可覆盖安装升级（v0.5.23：此前无 keystore 时 release
      # 兜底 debug keystore，runner 每次现生成 → 签名不同 → 覆盖安装必须卸载）。
      # 产物可直接安装；AAB 同理（Play 上传需自己的正式 keystore，此处仅作产物）。
      - name: 构建 Release APK 与 AAB
        working-directory: gui/build/android
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="1.0"; fi
          export VERSION_NAME="$VERSION"
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: warp-android
          path: |
            gui/build/android/app/build/outputs/apk/release/app-release.apk
            gui/build/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build-binary, build-gui, build-android]
    # 仅 tag 推送时创建 Release；workflow_dispatch 手动触发时跳过
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # 清理脚本需要 gh run list/delete
    steps:
      - name: 检出代码（gh release create 需要 git 上下文）
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          # find -type f 递归：Android APK/AAB 保留原始目录结构
          # （gui/build/android/...），直接 sha256sum * 会碰到 apk/bundle 目录。
          find . -type f -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt
          cat sha256sums.txt

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" $(find . -type f ! -name sha256sums.txt) --generate-notes

      - name: 清理过期 workflow 运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/scripts/cleanup-runs.sh
